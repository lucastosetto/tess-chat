services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tess
      POSTGRES_PASSWORD: tess
      POSTGRES_DB: tess
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/local/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tess"]
      interval: 2s
      retries: 20

volumes:
  pgdata:
